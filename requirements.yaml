---
# Root requirements file - includes all subsystem, platform, and OTS requirements

# root-tags identifies the requirements that represent externally observable product
# behavior ("system") or repository/process quality outcomes ("quality"). ReqStream's
# --enforce mode uses this to flag any requirement not reachable (directly or via
# children) from a root-tagged requirement as orphaned - low-level requirements added
# without a connection to real functionality. Configuring root-tags here (rather than
# passing --root-tags on the command line) means orphan checking runs automatically on
# every `dotnet reqstream --enforce` invocation, without agents needing to remember a flag.
root-tags:
  - system
  - quality

includes:
  - docs/reqstream/nuget-cache-tool.yaml
  - docs/reqstream/nuget-cache-tool/cli.yaml
  - docs/reqstream/nuget-cache-tool/cli/context.yaml
  - docs/reqstream/nuget-cache-tool/self-test.yaml
  - docs/reqstream/nuget-cache-tool/self-test/validation.yaml
  - docs/reqstream/nuget-cache-tool/utilities.yaml
  - docs/reqstream/nuget-cache-tool/utilities/path-helpers.yaml
  - docs/reqstream/nuget-cache-tool/utilities/temporary-directory.yaml
  - docs/reqstream/nuget-cache-tool/program.yaml
  - docs/reqstream/nuget-cache-tool/platform-requirements.yaml
  - docs/reqstream/quality.yaml
  - docs/reqstream/ots/xunit.yaml
  - docs/reqstream/ots/reqstream.yaml
  - docs/reqstream/ots/buildmark.yaml
  - docs/reqstream/ots/versionmark.yaml
  - docs/reqstream/ots/sarifmark.yaml
  - docs/reqstream/ots/sonarmark.yaml
  - docs/reqstream/ots/reviewmark.yaml
  - docs/reqstream/ots/pandoc.yaml
  - docs/reqstream/ots/weasyprint.yaml
  - docs/reqstream/ots/fileassert.yaml
  - docs/reqstream/ots/nuget-caching.yaml
  - docs/reqstream/ots/test-results.yaml
  - docs/reqstream/ots/sonarscanner.yaml
  - docs/reqstream/ots/sysml2tools.yaml

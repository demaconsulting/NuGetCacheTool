      - "docs/design/nuget-cache-tool/utilities.md"
      - "docs/reqstream/nuget-cache-tool/utilities.yaml"
    paths:
      - "docs/reqstream/nuget-cache-tool/utilities/path-helpers.yaml"
      - "docs/design/nuget-cache-tool/utilities/path-helpers.md"
      - "docs/verification/nuget-cache-tool/utilities/path-helpers.md"

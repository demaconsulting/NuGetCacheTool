---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following software unit boundaries.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                          # Root README
  - "requirements.yaml"                  # Requirement (top-level)
  - "docs/reqstream/**/*.yaml"           # Requirements files
  - "docs/design/**/*.md"               # Design documentation
  - "docs/user_guide/**/*.md"           # User guide
  - "**/*.cs"                            # All C# source and test files
  - "!**/obj/**"                         # Exclude build output
  - "!**/bin/**"                         # Exclude build output

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/NuGetCacheTool/reviews/index.json

# Review sets grouping files by logical unit of review.
# Organized following the hierarchical scope principle:
#   - Higher-level reviews exclude lower-level implementation details
#   - Only unit reviews include actual source code files
reviews:
  # Purpose review: proves that advertised features match system design
  - id: Purpose
    title: Review that Advertised Features Match System Design
    paths:
      - "README.md"
      - "docs/user_guide/**/*.md"
      - "docs/reqstream/nuget-cache-tool/nuget-cache-tool.yaml"
      - "docs/design/introduction.md"
      - "docs/design/nuget-cache-tool/nuget-cache-tool.md"

  # System architecture review: proves the system is designed and tested to satisfy its requirements
  - id: NuGetCacheTool-Architecture
    title: Review that NuGet Cache Tool Architecture Satisfies Requirements
    paths:
      - "docs/reqstream/nuget-cache-tool/nuget-cache-tool.yaml"
      - "docs/design/introduction.md"
      - "docs/design/nuget-cache-tool/nuget-cache-tool.md"
      - "test/**/IntegrationTests.cs"

  # System design review: proves the system design is consistent and complete
  - id: NuGetCacheTool-Design
    title: Review that NuGet Cache Tool Design is Consistent and Complete
    paths:
      - "docs/reqstream/nuget-cache-tool/nuget-cache-tool.yaml"
      - "docs/reqstream/nuget-cache-tool/platform-requirements.yaml"
      - "docs/design/introduction.md"
      - "docs/design/nuget-cache-tool/**/*.md"

  # All requirements review: proves requirements are consistent and complete
  - id: NuGetCacheTool-AllRequirements
    title: Review that All NuGet Cache Tool Requirements are Complete
    paths:
      - "requirements.yaml"
      - "docs/reqstream/nuget-cache-tool/**/*.yaml"
      - "docs/reqstream/ots/**/*.yaml"

  # CLI subsystem review: proves the CLI subsystem satisfies its requirements
  - id: NuGetCacheTool-Cli
    title: Review that NuGet Cache Tool CLI Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/nuget-cache-tool/cli/cli.yaml"
      - "docs/design/nuget-cache-tool/cli/cli.md"
      - "test/**/Cli/ContextTests.cs"

  # Context unit review: proves the Context unit is correctly implemented
  - id: NuGetCacheTool-Cli-Context
    title: Review that NuGet Cache Tool CLI Context Implementation is Correct
    paths:
      - "docs/reqstream/nuget-cache-tool/cli/context.yaml"
      - "docs/design/nuget-cache-tool/cli/context.md"
      - "src/**/Cli/Context.cs"
      - "test/**/Cli/ContextTests.cs"

  # SelfTest subsystem review: proves the SelfTest subsystem satisfies its requirements
  - id: NuGetCacheTool-SelfTest
    title: Review that NuGet Cache Tool SelfTest Satisfies Subsystem Requirements
    paths:
      - "docs/reqstream/nuget-cache-tool/self-test/self-test.yaml"
      - "docs/design/nuget-cache-tool/self-test/self-test.md"

  # Validation unit review: proves the Validation unit is correctly implemented
  - id: NuGetCacheTool-SelfTest-Validation
    title: Review that NuGet Cache Tool SelfTest Validation Implementation is Correct
    paths:
      - "docs/reqstream/nuget-cache-tool/self-test/validation.yaml"
      - "docs/design/nuget-cache-tool/self-test/validation.md"
      - "src/**/SelfTest/Validation.cs"

  # PathHelpers unit review: proves the PathHelpers unit is correctly implemented
  - id: NuGetCacheTool-SelfTest-PathHelpers
    title: Review that NuGet Cache Tool SelfTest PathHelpers Implementation is Correct
    paths:
      - "docs/reqstream/nuget-cache-tool/self-test/path-helpers.yaml"
      - "docs/design/nuget-cache-tool/self-test/path-helpers.md"
      - "src/**/SelfTest/PathHelpers.cs"
      - "test/**/SelfTest/PathHelpersTests.cs"

  # Program unit review: proves the Program unit is correctly implemented
  - id: NuGetCacheTool-Program
    title: Review that NuGet Cache Tool Program Implementation is Correct
    paths:
      - "docs/reqstream/nuget-cache-tool/program.yaml"
      - "docs/design/nuget-cache-tool/program.md"
      - "src/**/Program.cs"
      - "test/**/ProgramTests.cs"
      - "test/**/AssemblyInfo.cs"

  # OTS dependency review
  - id: NuGetCacheTool-OTS
    title: Review of Off-The-Shelf Software Dependencies
    paths:
      - "docs/reqstream/ots/*.yaml"

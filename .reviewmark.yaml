---
# ReviewMark Configuration File
# This file defines which files require review, where the evidence store is located,
# and how files are grouped into named review-sets following software unit boundaries.

# Patterns identifying all files that require review.
# Processed in order; prefix a pattern with '!' to exclude.
needs-review:
  - "README.md"                    # Project readme
  - "requirements.yaml"            # Root requirements file
  - "**/*.cs"                      # All C# source and test files
  - "docs/reqstream/**/*.yaml"     # Requirements files
  - "docs/design/**/*.md"          # Design documents
  - "docs/verification/**/*.md"    # Verification documents
  - "docs/user_guide/**/*.md"      # User guide documents
  - "!**/obj/**"                   # Exclude build output
  - "!**/bin/**"                   # Exclude build output
  - "!node_modules/**"             # Exclude npm dependencies
  - "!**/.venv/**"                 # Exclude Python virtual environment

# Evidence source: review data and index.json are located in the 'reviews' branch
# of this repository, accessed through the GitHub public HTTPS raw content access.
# Note: The 'reviews' branch must be created and populated with review evidence PDFs
# and an index.json before enforcement (--enforce flag) can be enabled in the pipeline.
evidence-source:
  type: url
  location: https://raw.githubusercontent.com/demaconsulting/NuGetCacheTool/reviews/index.json

# Review sets following hierarchical scope principles.
# Each review-set focuses on a single compliance question with manageable file counts.
reviews:
  # Purpose
  - id: Purpose
    title: Review of user-facing capabilities and system promises
    paths:
      - "README.md"
      - "docs/user_guide/**/*.md"
      - "docs/reqstream/nuget-cache-tool.yaml"
      - "docs/design/introduction.md"
      - "docs/design/nuget-cache-tool.md"

  # NuGetCacheTool - Specials
  - id: NuGetCacheTool-Architecture
    title: Review of NuGet Cache Tool system architecture and operational validation
    paths:
      - "docs/reqstream/nuget-cache-tool.yaml"
      - "docs/design/introduction.md"
      - "docs/design/nuget-cache-tool.md"
      - "docs/verification/nuget-cache-tool.md"
      - "test/**/AssemblyInfo.cs"
      - "test/**/Runner.cs"
      - "test/**/IntegrationTests.cs"

  - id: NuGetCacheTool-Design
    title: Review of NuGet Cache Tool architectural and design consistency
    paths:
      - "docs/reqstream/nuget-cache-tool.yaml"
      - "docs/reqstream/nuget-cache-tool/platform-requirements.yaml"
      - "docs/design/introduction.md"
      - "docs/design/nuget-cache-tool.md"
      - "docs/design/nuget-cache-tool/**/*.md"
      - "docs/verification/introduction.md"

  - id: NuGetCacheTool-AllRequirements
    title: Review of NuGet Cache Tool requirements quality and traceability
    paths:
      - "requirements.yaml"
      - "docs/reqstream/nuget-cache-tool.yaml"
      - "docs/reqstream/nuget-cache-tool/**/*.yaml"
      - "docs/reqstream/ots/*.yaml"

  # NuGetCacheTool - Program
  - id: NuGetCacheTool-Program
    title: Review of NuGet Cache Tool Program unit implementation
    paths:
      - "docs/reqstream/nuget-cache-tool/program.yaml"
      - "docs/design/nuget-cache-tool/program.md"
      - "docs/verification/nuget-cache-tool/program.md"
      - "src/**/Program.cs"
      - "test/**/ProgramTests.cs"

  # NuGetCacheTool - Cli
  - id: NuGetCacheTool-Cli
    title: Review of NuGet Cache Tool Cli subsystem architecture and interfaces
    paths:
      - "docs/reqstream/nuget-cache-tool/cli.yaml"
      - "docs/design/nuget-cache-tool/cli.md"
      - "docs/verification/nuget-cache-tool/cli.md"
      - "test/**/Cli/CliTests.cs"

  - id: NuGetCacheTool-Cli-Context
    title: Review of NuGet Cache Tool Context unit implementation
    paths:
      - "docs/reqstream/nuget-cache-tool/cli/context.yaml"
      - "docs/design/nuget-cache-tool/cli/context.md"
      - "docs/verification/nuget-cache-tool/cli/context.md"
      - "src/**/Cli/Context.cs"
      - "test/**/Cli/ContextTests.cs"

  # NuGetCacheTool - SelfTest
  - id: NuGetCacheTool-SelfTest
    title: Review of NuGet Cache Tool SelfTest subsystem architecture and interfaces
    paths:
      - "docs/reqstream/nuget-cache-tool/self-test.yaml"
      - "docs/design/nuget-cache-tool/self-test.md"
      - "docs/verification/nuget-cache-tool/self-test.md"
      - "test/**/SelfTest/SelfTestTests.cs"

  - id: NuGetCacheTool-SelfTest-Validation
    title: Review of NuGet Cache Tool Validation unit implementation
    paths:
      - "docs/reqstream/nuget-cache-tool/self-test/validation.yaml"
      - "docs/design/nuget-cache-tool/self-test/validation.md"
      - "docs/verification/nuget-cache-tool/self-test/validation.md"
      - "src/**/SelfTest/Validation.cs"
      - "test/**/SelfTest/ValidationTests.cs"

  - id: NuGetCacheTool-SelfTest-PathHelpers
    title: Review of NuGet Cache Tool PathHelpers unit implementation
    paths:
      - "docs/reqstream/nuget-cache-tool/self-test/path-helpers.yaml"
      - "docs/design/nuget-cache-tool/self-test/path-helpers.md"
      - "docs/verification/nuget-cache-tool/self-test/path-helpers.md"
      - "src/**/SelfTest/PathHelpers.cs"
      - "test/**/SelfTest/PathHelpersTests.cs"

  # OTS Items
  - id: OTS-BuildMark
    title: Review of BuildMark OTS verification evidence
    paths:
      - "docs/reqstream/ots/buildmark.yaml"
      - "docs/verification/ots/buildmark.md"

  - id: OTS-FileAssert
    title: Review of FileAssert OTS verification evidence
    paths:
      - "docs/reqstream/ots/fileassert.yaml"
      - "docs/verification/ots/fileassert.md"

  - id: OTS-Pandoc
    title: Review of Pandoc OTS verification evidence
    paths:
      - "docs/reqstream/ots/pandoc.yaml"
      - "docs/verification/ots/pandoc.md"

  - id: OTS-ReqStream
    title: Review of ReqStream OTS verification evidence
    paths:
      - "docs/reqstream/ots/reqstream.yaml"

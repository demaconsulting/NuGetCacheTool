<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. Package:version arguments, NuGet feeds, and the log and silent options flow into the
       nuget-cache tool and come out as packages cached in the global packages folder, one cache path per package,
       a pass/fail exit code, and a log file.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 92px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 40px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176" style="font-size:60px">NuGet</text>
  <text class="word brandText" x="232" y="176" style="font-size:60px">CacheTool</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">Every package, cached.</text>
  <text class="tag brandText" x="56" y="316">Every build, offline.</text>
  <text class="body" x="58" y="368">A .NET tool that fills the NuGet global</text>
  <text class="body" x="58" y="402">packages folder before the build, for</text>
  <text class="body" x="58" y="436">CI jobs and air-gapped build machines.</text>
  <rect x="56" y="468" width="480" height="90" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd prompt" x="78" y="503">$</text>
  <text class="cmd" x="108" y="503">nuget-cache</text>
  <text class="cmd file" x="138" y="539">Newtonsoft.Json:13.0.3</text>
  <text class="note" x="58" y="604">Built for Continuous Compliance.</text>

  <!-- Input cards -->
  <g>
    <!-- Package arguments: package:version pairs on the command line -->
    <rect class="card" x="580" y="40" width="356" height="160" rx="16"/>
    <rect x="702" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="340" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <rect x="14" y="14" width="312" height="38" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
      <text class="miniMono" x="26" y="41" fill="#f8fafc">Newtonsoft.Json</text>
      <text class="miniMono" x="224" y="41" fill="#fde68a">:13.0.3</text>
      <rect x="14" y="62" width="312" height="38" rx="8" fill="#fbbf24" fill-opacity="0.12" stroke="#fbbf24" stroke-opacity="0.7" stroke-width="1.5"/>
      <text class="miniMono" x="26" y="89" fill="#f8fafc">NuGet.Common</text>
      <text class="miniMono" x="184" y="89" fill="#fde68a">:6.12.1</text>
    </g>
    <text class="label" x="758" y="190">package:version args</text>

    <!-- NuGet feeds: a package feed serving .nupkg files -->
    <rect class="card" x="948" y="40" width="300" height="160" rx="16"/>
    <rect x="1042" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="956" y="48" width="284" height="112" rx="10"/>
    <g transform="translate(956 48)">
      <path d="M44 74 C24 74 22 48 42 46 C44 26 70 20 82 36 C92 24 114 30 112 48 C130 50 128 74 110 74 Z" fill="#22d3ee" fill-opacity="0.18" stroke="#22d3ee" stroke-width="2.5"/>
      <path d="M78 80 L78 100" stroke="#22d3ee" stroke-width="3" stroke-linecap="round"/>
      <path d="M70 94 L78 103 L86 94" fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="146" y="22" width="120" height="32" rx="7" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="mini" x="206" y="46" fill="#a5f3fc" text-anchor="middle">.nupkg</text>
      <rect x="146" y="66" width="120" height="32" rx="7" fill="#22d3ee" fill-opacity="0.16" stroke="#22d3ee" stroke-width="1.5"/>
      <text class="mini" x="206" y="90" fill="#a5f3fc" text-anchor="middle">.nupkg</text>
    </g>
    <text class="label" x="1098" y="190">NuGet feeds</text>

    <!-- Options: the log and silent switches -->
    <rect class="card" x="1260" y="40" width="300" height="160" rx="16"/>
    <rect x="1354" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1268" y="48" width="284" height="112" rx="10"/>
    <g transform="translate(1268 48)">
      <text class="miniMono" x="22" y="42" fill="#f9a8d4">--log</text>
      <text class="miniMono" x="104" y="42" fill="#f8fafc">output.log</text>
      <text class="miniMono" x="22" y="88" fill="#f9a8d4">--silent</text>
      <rect x="146" y="72" width="52" height="24" rx="12" fill="#f472b6" fill-opacity="0.3" stroke="#f472b6" stroke-width="1.5"/>
      <circle cx="186" cy="84" r="9" fill="#fbcfe8"/>
    </g>
    <text class="label" x="1410" y="190">Options</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M758,206 C758,236 970,226 970,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M1098,206 C1098,236 1070,226 1070,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1410,206 C1410,236 1170,226 1170,253" stroke="#f472b6" marker-end="url(#headPink)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="758" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="1098" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1410" cy="206" r="5" fill="#f472b6"/>
  </g>
  <!-- The engine: the nuget-cache command, with a package-box glyph -->
  <rect x="843" y="262" width="454" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="843" y="262" width="454" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="867" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M885 282 L898 288 L898 302 L885 308 L872 302 L872 288 Z" fill="#ffffff"/>
  <path d="M872 288 L885 294 L898 288 M885 294 L885 308" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linejoin="round"/>
  <text class="engine" x="919" y="305">nuget-cache</text>
  <line x1="1142" y1="278" x2="1142" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1162" y="303">.NET tool</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Cached packages: the global packages folder with the package id and version folders -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <g transform="translate(588 398)">
      <path d="M14 20 L28 20 L32 24 L42 24 L42 42 L14 42 Z" fill="#fbbf24"/>
      <text class="miniMono" x="50" y="40" fill="#f8fafc">packages/</text>
      <path d="M26 48 L26 78 L36 78" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M38 66 L52 66 L56 70 L66 70 L66 88 L38 88 Z" fill="#22d3ee"/>
      <text class="miniMono" x="72" y="86" fill="#f8fafc">newtonsoft.json</text>
      <path d="M50 94 L50 124 L60 124" fill="none" stroke="#94a3b8" stroke-width="2"/>
      <path d="M62 112 L76 112 L80 116 L90 116 L90 134 L62 134 Z" fill="#5eead4"/>
      <text class="miniMono" x="96" y="132" fill="#f8fafc">13.0.3/</text>
    </g>
    <text class="label" x="728" y="585">Cached packages</text>

    <!-- Cache paths: one path per package written to standard output -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <g transform="translate(897 398)">
      <rect x="12" y="12" width="180" height="128" rx="8" fill="#111827" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
      <circle cx="26" cy="26" r="4" fill="#f472b6"/>
      <circle cx="40" cy="26" r="4" fill="#fbbf24"/>
      <circle cx="54" cy="26" r="4" fill="#4ade80"/>
      <text class="miniMono" x="24" y="66" fill="#5eead4">.../</text>
      <text class="miniMono" x="77" y="66" fill="#e2e8f0">13.0.3</text>
      <text class="miniMono" x="24" y="98" fill="#5eead4">.../</text>
      <text class="miniMono" x="77" y="98" fill="#e2e8f0">6.12.1</text>
      <rect x="24" y="116" width="120" height="8" rx="4" fill="#cbd5e1" fill-opacity="0.45"/>
    </g>
    <text class="label" x="999" y="585">Cache paths</text>

    <!-- Exit code: pass with 0, fail with 1 -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <text class="miniMono" x="1150" y="452" fill="#f8fafc">exit 0</text>
    <rect x="1244" y="430" width="74" height="30" rx="15" fill="#4ade80" fill-opacity="0.18" stroke="#4ade80" stroke-width="1.5"/>
    <text class="mini" x="1281" y="452" fill="#bbf7d0" text-anchor="middle">pass</text>
    <line x1="1146" y1="474" x2="1318" y2="474" stroke="#ffffff" stroke-opacity="0.15"/>
    <text class="miniMono" x="1150" y="512" fill="#f8fafc">exit 1</text>
    <rect x="1244" y="490" width="74" height="30" rx="15" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="1.5"/>
    <text class="mini" x="1281" y="512" fill="#fecaca" text-anchor="middle">fail</text>
    <text class="label" x="1232" y="585">Exit code</text>

    <!-- Log file: the file named by the log option -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <circle cx="1457" cy="448" r="24" fill="url(#brand)"/>
    <path d="M1447 434 L1462 434 L1469 441 L1469 462 L1447 462 Z" fill="#ffffff"/>
    <rect x="1379" y="494" width="156" height="38" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#5eead4" stroke-opacity="0.6" stroke-width="1.5"/>
    <text class="miniMono" x="1457" y="520" fill="#e2e8f0" text-anchor="middle">output.log</text>
    <text class="label" x="1457" y="585">Log file</text>
  </g>
</svg>

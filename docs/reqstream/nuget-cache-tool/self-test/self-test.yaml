---
# NuGet Cache Tool SelfTest Subsystem Requirements
#
# Requirements for the SelfTest subsystem: self-validation and safe path utilities.

sections:
  - title: NuGet Cache Tool Requirements
    sections:
      - title: SelfTest
        requirements:
          - id: NuGetCache-SelfTest-Validation
            title: The SelfTest subsystem shall execute self-validation tests to verify deployment health.
            justification: |
              Provides a built-in mechanism to verify the tool is functioning correctly
              in the deployment environment. Self-validation runs the core operations
              end-to-end and reports pass/fail results.
            children:
              - NuGetCache-Validation-SelfValidation
            tests:
              - SelfTest_Validation_ExecutesSelfValidationTests
              - SelfTest_Validation_ReportsPassFail

          - id: NuGetCache-SelfTest-ResultsFile
            title: The SelfTest subsystem shall write validation results in TRX or JUnit format.
            justification: |
              Enables integration with CI/CD systems that expect standard test result formats,
              allowing self-validation outcomes to feed into requirements traceability pipelines.
              The --results flag specifies the output file; .trx uses TRX format, .xml uses JUnit.
            children:
              - NuGetCache-Validation-ResultsFile
            tests:
              - SelfTest_ResultsFile_GeneratesTrxFile
              - SelfTest_ResultsFile_GeneratesJUnitFile

          - id: NuGetCache-SelfTest-SafePathCombine
            title: The SelfTest subsystem shall prevent path traversal attacks when combining file paths.
            justification: |
              Accepting user-controlled path components without validation could allow
              an attacker to read or write files outside intended directories. The
              SafePathCombine method must reject absolute paths and parent-directory
              references (e.g. "..") in the relative component.
            children:
              - NuGetCache-PathHelpers-SafePathCombine
            tests:
              - SelfTest_SafePathCombine_AcceptsValidPaths
              - SelfTest_SafePathCombine_RejectsPathTraversal

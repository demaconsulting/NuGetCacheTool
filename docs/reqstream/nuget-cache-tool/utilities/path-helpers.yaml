---
# NuGet Cache Tool PathHelpers Unit Requirements
#
# Requirements for the PathHelpers class: safe path combination utilities.

sections:
  - title: NuGet Cache Tool Requirements
    sections:
      - title: PathHelpers
        requirements:
          - id: NuGetCache-PathHelpers-SafePathCombine
            title: The PathHelpers class shall prevent path traversal attacks when combining file paths.
            justification: |
              Accepting user-controlled path components without validation could allow
              an attacker to read or write files outside intended directories. The combined
              path must reject absolute-path overrides and parent-directory traversal
              (e.g. "..") while correctly accepting valid relative paths including filenames
              that begin with ".." (e.g. "..data").
            tests:
              - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
              - PathHelpers_SafePathCombine_PathTraversalWithDoubleDots_ThrowsArgumentException
              - PathHelpers_SafePathCombine_DoubleDotsInMiddle_ThrowsArgumentException
              - PathHelpers_SafePathCombine_UnixAbsolutePath_ThrowsArgumentException
              - PathHelpers_SafePathCombine_WindowsAbsolutePath_ThrowsArgumentException
              - PathHelpers_SafePathCombine_CurrentDirectoryReference_CombinesCorrectly
              - PathHelpers_SafePathCombine_NestedPaths_CombinesCorrectly
              - PathHelpers_SafePathCombine_EmptyRelativePath_ReturnsBasePath
              - PathHelpers_SafePathCombine_DoubleDotPrefix_CombinesCorrectly

          - id: NuGetCache-PathHelpers-NullArguments
            title: >-
              The path combination function shall report an error when a null base path or null relative path is provided.
            justification: |
              Defensive null checking prevents NullReferenceException propagation and provides
              clear diagnostic messages to callers who pass uninitialized path values.
            tests:
              - PathHelpers_SafePathCombine_NullBase_ThrowsArgumentNullException
              - PathHelpers_SafePathCombine_NullRelative_ThrowsArgumentNullException

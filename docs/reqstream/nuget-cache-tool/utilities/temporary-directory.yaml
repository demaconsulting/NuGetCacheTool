---
# NuGet Cache Tool TemporaryDirectory Unit Requirements

sections:
  - title: NuGet Cache Tool Requirements
    sections:
      - title: Utilities Subsystem Requirements
        sections:
          - title: TemporaryDirectory Unit Requirements
            requirements:
              - id: NuGetCache-TemporaryDirectory-DirectoryCreation
                title: The TemporaryDirectory class shall create a unique temporary directory under the current working directory
                  on construction.
                justification: |
                  Using Environment.CurrentDirectory as the base — rather than Path.GetTempPath() —
                  avoids the macOS /tmp → /private/tmp symlink issue that causes path-comparison
                  failures. A GUID-derived name guarantees uniqueness so concurrent test runs do not
                  collide.
                tests:
                  - TemporaryDirectory_Constructor_WhenCalled_CreatesDirectoryOnDisk
                  - TemporaryDirectory_Constructor_MultipleInstances_CreatesUniqueDirectories

              - id: NuGetCache-TemporaryDirectory-FilePathResolution
                title: The TemporaryDirectory class shall resolve relative paths to absolute paths within the temporary directory,
                  creating any required intermediate subdirectories.
                justification: |
                  Callers need a safe way to obtain a full path for a file that may be nested
                  arbitrarily deep within the temporary directory. Auto-creating intermediate
                  subdirectories removes boilerplate from every caller.
                tests:
                  - TemporaryDirectory_GetFilePath_SimpleFile_ReturnsPathUnderDirectory
                  - TemporaryDirectory_GetFilePath_NestedPath_CreatesIntermediateDirectories

              - id: NuGetCache-TemporaryDirectory-TraversalRejection
                title: The TemporaryDirectory class shall reject relative paths that escape the temporary directory boundary
                  with an ArgumentException.
                justification: |
                  GetFilePath delegates to PathHelpers.SafePathCombine, which enforces the
                  boundary. Surfacing ArgumentException ensures callers receive a clear diagnostic
                  if an invalid path is supplied.
                tests:
                  - TemporaryDirectory_GetFilePath_TraversalAttempt_ThrowsArgumentException

              - id: NuGetCache-TemporaryDirectory-Disposal-DeletesContents
                title: The TemporaryDirectory class shall delete the temporary directory and all its contents on disposal.
                justification: |
                  Automatic cleanup prevents accumulation of temporary artifacts after a test run
                  or self-test execution.
                tests:
                  - TemporaryDirectory_Dispose_WhenCalled_DeletesDirectory

              - id: NuGetCache-TemporaryDirectory-Disposal-IdempotentWhenMissing
                title: The TemporaryDirectory class shall not throw when disposed after the temporary directory no longer
                  exists.
                justification: |
                  Suppressing cleanup errors ensures disposal does not mask the original outcome or
                  break using blocks when the directory has already been removed (for example, by
                  the code under test).
                tests:
                  - TemporaryDirectory_Dispose_AlreadyDeleted_DoesNotThrow

              - id: NuGetCache-TemporaryDirectory-Constructor-CreationFailure
                title: The TemporaryDirectory class shall throw an InvalidOperationException when the temporary directory
                  cannot be created.
                justification: |
                  Surfacing a clear, specific exception when directory creation fails (for example,
                  due to file-system permissions) helps callers distinguish this failure from other
                  error conditions rather than propagating an unrelated low-level I/O exception.
                tests:
                  - TemporaryDirectory_Constructor_DirectoryCreationFails_ThrowsInvalidOperationException

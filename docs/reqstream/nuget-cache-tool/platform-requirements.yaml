---
# NuGet Cache Tool Platform Requirements
#
# Requirements for the platform support of the NuGet Cache Tool.

sections:
  - title: NuGet Cache Tool Requirements
    sections:
      - title: Platform Support
        requirements:
          - id: NuGetCache-PLT-Windows
            title: The tool shall run on Windows platforms.
            justification: |
              DEMA Consulting tools must support Windows as a major development platform.
            tests:
              # Tests link to "windows" to ensure results come from Windows platform
              - "windows@NuGetCache_VersionDisplay"
              - "windows@NuGetCache_HelpDisplay"

          - id: NuGetCache-PLT-Linux
            title: The tool shall run on Linux platforms.
            justification: |
              DEMA Consulting tools must support Linux for CI/CD and containerized environments.
            tests:
              # Tests link to "ubuntu" to ensure results come from Linux platform
              - "ubuntu@NuGetCache_VersionDisplay"
              - "ubuntu@NuGetCache_HelpDisplay"

          - id: NuGetCache-PLT-MacOS
            title: The tool shall run on macOS platforms.
            justification: |
              DEMA Consulting tools must support macOS for developers using Apple platforms.
            tests:
              # Tests link to "macos" to ensure results come from macOS platform
              - "macos@NuGetCache_VersionDisplay"
              - "macos@NuGetCache_HelpDisplay"

          - id: NuGetCache-PLT-Net8
            title: The tool shall support .NET 8 runtime.
            justification: |
              .NET 8 is an LTS release providing long-term stability for enterprise users.
            tests:
              - "dotnet8.x@NuGetCache_VersionDisplay"
              - "dotnet8.x@NuGetCache_HelpDisplay"

          - id: NuGetCache-PLT-Net9
            title: The tool shall support .NET 9 runtime.
            justification: |
              .NET 9 support enables users to leverage the latest .NET features.
            tests:
              - "dotnet9.x@NuGetCache_VersionDisplay"
              - "dotnet9.x@NuGetCache_HelpDisplay"

          - id: NuGetCache-PLT-Net10
            title: The tool shall support .NET 10 runtime.
            justification: |
              .NET 10 support ensures the tool remains compatible with the latest .NET ecosystem.
            tests:
              - "dotnet10.x@NuGetCache_VersionDisplay"
              - "dotnet10.x@NuGetCache_HelpDisplay"

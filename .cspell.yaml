---
# Spell-Checking
#
# PURPOSE:
# - Maintain professional documentation and code quality
# - Catch spelling errors before publication
# - Support consistent technical terminology usage
# - Misspelled words should be fixed in the source
# - NEVER add a misspelled word to the 'words' list
# - PROPOSE only genuine technical terms/names as needed

version: '0.2'

language: en

# TODO: Add project-specific technical terms and tool names
words:
  - buildmark
  - DEMA
  - Dema
  - demaconsulting
  - fileassert
  - mstest
  - Newtonsoft
  - xunit
  - notapackage
  - Postconditions
  - nugetcache
  - Pandoc
  - reqstream
  - reviewmark
  - SARIF
  - Sarif
  - sarifmark
  - sonarmark
  - sonarqube
  - sonarscanner
  - versionmark
  - Weasy
  - Weasyprint
  - yamlfix

# Exclude common build artifacts, dependencies, and vendored third-party code
ignorePaths:
  - '**/.git/**'
  - '**/node_modules/**'
  - '**/.venv/**'
  - '**/thirdparty/**'
  - '**/third-party/**'
  - '**/3rd-party/**'
  - '**/.agent-logs/**'
  - '**/bin/**'
  - '**/obj/**'
  - '**/generated/**'
  - package-lock.json
